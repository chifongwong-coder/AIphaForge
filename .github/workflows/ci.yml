name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/
      - name: Type check (advisory, non-blocking)
        run: mypy src/aiphaforge/
        continue-on-error: true
      - name: Type check (strict, scoped blocking gate)
        run: mypy src/aiphaforge/alpha/
      - run: pytest tests/ -v
